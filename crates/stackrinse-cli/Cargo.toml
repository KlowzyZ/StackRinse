[package]
name = "stackrinse-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only developer storage discovery and cleanup previews"

[[bin]]
name = "stackrinse"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
serde.workspace = true
serde_json.workspace = true
stackrinse-core.workspace = true

[dev-dependencies]
tempfile = "3"
