[package]
name = "stackrinse-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Read-only developer artifact discovery and review policy"

[dependencies]
rayon = "1.10"
serde.workspace = true
thiserror = "2"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
