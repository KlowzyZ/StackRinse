name: StackRinse checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  platform:
    name: Rust, desktop and CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/stackrinse-desktop/package-lock.json
      - name: Set up stable Rust
        run: rustup update stable --no-self-update
      - run: rustup default stable
      - run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb xauth
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install desktop dependencies
        working-directory: apps/stackrinse-desktop
        run: npm ci
      - name: Type-check and build desktop assets
        working-directory: apps/stackrinse-desktop
        run: npm run build
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Compile native desktop with embedded frontend
        run: cargo build --locked -p stackrinse-desktop --features custom-protocol
      - name: Install Chromium for interaction tests
        if: runner.os == 'Linux'
        working-directory: apps/stackrinse-desktop
        run: npx playwright install --with-deps chromium
      - name: Test desktop interaction flows
        if: runner.os == 'Linux'
        working-directory: apps/stackrinse-desktop
        run: npm run test:e2e

      - name: Exercise the embedded Linux webview, scan history, and native dry run
        if: runner.os == 'Linux'
        run: xvfb-run -a dbus-run-session -- python3 apps/stackrinse-desktop/e2e/native_linux.py target/debug/stackrinse-desktop "$RUNNER_TEMP/native-overview.png"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-native-overview
          path: |
            ${{ runner.temp }}/native-overview.png
            ${{ runner.temp }}/native-history.png
          retention-days: 7
