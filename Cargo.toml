[workspace]
members = ["crates/stackrinse-core", "crates/stackrinse-cli", "apps/stackrinse-desktop/src-tauri"]
default-members = ["crates/stackrinse-core", "crates/stackrinse-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/KlowzyZ/StackRinse"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stackrinse-core = { path = "crates/stackrinse-core" }
