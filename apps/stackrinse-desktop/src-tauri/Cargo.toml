[package]
name = "stackrinse-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline developer storage discovery and dry-run review"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
stackrinse-core = { path = "../../../crates/stackrinse-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
fs2 = "0.4"
rusqlite = { version = "0.43", features = ["bundled", "limits"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
