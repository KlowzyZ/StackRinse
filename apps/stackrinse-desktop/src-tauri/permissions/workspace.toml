[[permission]]
identifier = "workspace-inventory"
description = "Manage the local inventory, scan history, dry-run previews, and exports through a native save dialog."
commands.allow = [
    "get_settings",
    "choose_root",
    "remove_root",
    "set_preferences",
    "set_project_protection",
    "scan",
    "cancel_scan",
    "dry_run",
    "history_list",
    "history_detail",
    "history_compare",
    "history_remove",
    "history_clear",
    "history_set_retention",
    "export_inventory",
]
